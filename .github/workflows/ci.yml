name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-cli-smoke:
    name: "🐍 Broker CLI Smoke"
    runs-on: ubuntu-latest
    env:
      BROKER_LAUNCH_IB: "0"

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "🐍 Setup Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: "⚡ Setup uv"
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: "📦 Install broker Python packages"
        run: |
          uv venv --python 3.12 --seed --allow-existing
          .venv/bin/python -m pip install -e './daemon[dev]' -e './sdk/python[dev]' -e './cli[dev]'

      - name: "🧪 Run broker --help smoke check"
        run: .venv/bin/broker --help

  broker-python-tests:
    name: "🐍 PyTest • ${{ matrix.suite_name }}"
    runs-on: ubuntu-latest
    env:
      BROKER_LAUNCH_IB: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite_name: "daemon"
            suite_path: "daemon/tests"
          - suite_name: "cli"
            suite_path: "cli/tests"
          - suite_name: "sdk-python"
            suite_path: "sdk/python/tests"

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "🐍 Setup Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: "⚡ Setup uv"
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: "📦 Install broker Python packages"
        run: |
          uv venv --python 3.12 --seed --allow-existing
          .venv/bin/python -m pip install -e './daemon[dev]' -e './sdk/python[dev]' -e './cli[dev]'

      - name: "🧪 Run pytest (${{ matrix.suite_name }})"
        run: .venv/bin/python -m pytest "${{ matrix.suite_path }}" -q

  typescript-typecheck:
    name: "🧩 TypeScript SDK Typecheck"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "🥟 Setup Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: "📦 Install dependencies"
        run: cd sdk/typescript && bun install

      - name: "🧪 Run typecheck"
        run: cd sdk/typescript && bun run typecheck

  shell-script-syntax:
    name: "🐚 Shell Script Syntax"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "🧪 Validate bash syntax"
        run: find . -type f -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 bash -n
